# Temporary: verifies the embedded data directory lock on macOS and Windows. Removed before merge.
name: Lock platforms (temporary)

on:
  push:
    branches: [fix/embedded-data-dir-lock]

permissions:
  contents: read

jobs:
  lock:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx vitest run src/db/runtime/embedded-persistence.integration.test.ts src/logger.test.ts
