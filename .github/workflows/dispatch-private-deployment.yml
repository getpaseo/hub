name: Dispatch private deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact green commit
        env:
          GH_TOKEN: ${{ secrets.HUB_PRIVATE_DISPATCH_TOKEN }}
          HUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --method POST repos/getpaseo/hub-private/dispatches \
            --field event_type=hub-main-green \
            --raw-field "client_payload[hub_sha]=$HUB_SHA"
