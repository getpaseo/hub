app = 'paseo-hub'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  PASEO_HUB_PUBLIC_URL = 'https://paseo-hub.fly.dev'
  PASEO_HUB_TRUSTED_CLIENT_IP_HEADER = 'fly-client-ip'
  # PASEO_HUB_COMPLETION_TOKEN_SECRET must be installed with `fly secrets set`.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
